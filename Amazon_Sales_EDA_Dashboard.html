<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Sales Dataset - EDA Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #fff;
            --border: #ccc;
            --btn-bg: #ff9900;
            --btn-text: #111;
        }
        body.dark-mode {
            --bg-color: #0f1115;
            --text-color: #e0e0e0;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border: #30363d;
            --btn-bg: #febd69;
            --btn-text: #111;
            background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .toggle-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .kpi-card {
            flex: 1;
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .kpi-card h3 { margin: 0; font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .kpi-card h2 { margin: 10px 0 0 0; font-size: 32px; font-weight: 700; }
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .chart-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .chart-card-full {
            grid-column: span 2;
        }
        canvas {
            width: 100% !important;
            height: 320px !important;
        }
    </style>
</head>
<body class="dark-mode">
    <div class="header">
        <h1>Amazon Sales EDA Dashboard</h1>
        <button class="toggle-btn" onclick="toggleTheme()">Toggle Dark Mode</button>
    </div>

    <div class="kpi-container">
        <div class="kpi-card">
            <h3>Avg Discount</h3>
            <h2>47.5%</h2>
        </div>
        <div class="kpi-card">
            <h3>Avg Rating</h3>
            <h2>4.1 / 5.0</h2>
        </div>
        <div class="kpi-card">
            <h3>Top Category</h3>
            <h2>Electronics</h2>
        </div>
        <div class="kpi-card">
            <h3>Est. Revenue</h3>
            <h2>$1.42M</h2>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-card">
            <canvas id="categoryChart"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="ratingDistChart"></canvas>
        </div>
        <div class="chart-card chart-card-full">
            <canvas id="discountVsRatingChart"></canvas>
        </div>
    </div>

    <script>
        let charts = [];

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            updateChartColors();
        }

        function getChartColors() {
            const isDark = document.body.classList.contains('dark-mode');
            return {
                textColor: isDark ? '#e0e0e0' : '#333',
                gridColor: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)'
            };
        }

        const categoryData = {
            categories: ['Electronics', 'Computers & Accessories', 'Home & Kitchen', 'Office Products', 'Home Audio'],
            counts: [528, 381, 448, 112, 85]
        };

        const ratingDist = {
            ratings: ['3.0 - 3.5', '3.5 - 4.0', '4.0 - 4.5', '4.5 - 5.0'],
            productCounts: [42, 210, 890, 323]
        };

        const discountRatingData = {
            discounts: ['10-30%', '30-50%', '50-70%', '70-90%'],
            avgRatings: [4.25, 4.18, 4.12, 3.98]
        };

        const getOptions = (title) => {
            const colors = getChartColors();
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: colors.textColor } },
                    title: { display: true, text: title, color: colors.textColor, font: { size: 18 } }
                },
                scales: {
                    x: { ticks: { color: colors.textColor }, grid: { color: colors.gridColor } },
                    y: { ticks: { color: colors.textColor }, grid: { color: colors.gridColor } }
                }
            };
        };

        function initCharts() {
            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            charts.push(new Chart(ctxCat, {
                type: 'bar',
                data: {
                    labels: categoryData.categories,
                    datasets: [{
                        label: 'Product Count',
                        data: categoryData.counts,
                        backgroundColor: 'rgba(255, 153, 0, 0.8)',
                        borderColor: 'rgba(255, 153, 0, 1)',
                        borderWidth: 1
                    }]
                },
                options: getOptions('Product Count by Category')
            }));

            const ctxRating = document.getElementById('ratingDistChart').getContext('2d');
            charts.push(new Chart(ctxRating, {
                type: 'doughnut',
                data: {
                    labels: ratingDist.ratings,
                    datasets: [{
                        label: 'Products',
                        data: ratingDist.productCounts,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(255, 206, 86, 0.8)',
                            'rgba(75, 192, 192, 0.8)',
                            'rgba(54, 162, 235, 0.8)'
                        ]
                    }]
                },
                options: getOptions('Rating Distribution')
            }));

            const ctxDisc = document.getElementById('discountVsRatingChart').getContext('2d');
            charts.push(new Chart(ctxDisc, {
                type: 'line',
                data: {
                    labels: discountRatingData.discounts,
                    datasets: [{
                        label: 'Average Customer Rating',
                        data: discountRatingData.avgRatings,
                        borderColor: '#febd69',
                        backgroundColor: 'rgba(254, 189, 105, 0.2)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 6
                    }]
                },
                options: getOptions('Average Rating by Discount Tier')
            }));
        }

        function updateChartColors() {
            const colors = getChartColors();
            charts.forEach(chart => {
                chart.options.plugins.legend.labels.color = colors.textColor;
                chart.options.plugins.title.color = colors.textColor;
                
                if (chart.options.scales.x) {
                    chart.options.scales.x.ticks.color = colors.textColor;
                    chart.options.scales.x.grid.color = colors.gridColor;
                }
                if (chart.options.scales.y) {
                    chart.options.scales.y.ticks.color = colors.textColor;
                    chart.options.scales.y.grid.color = colors.gridColor;
                }
                chart.update();
            });
        }

        window.onload = initCharts;
    </script>
</body>
</html>
